version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: manufacturing_postgres
    restart: always
    environment:
      POSTGRES_DB: manufacturing_db
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d manufacturing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
